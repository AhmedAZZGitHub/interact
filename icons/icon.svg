<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#F7A81B"/>
      <stop offset="100%" stop-color="#D48806"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>
  
  <!-- Rotary / Interact Outer Ring Gear -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Decorative Wheel spokes -->
    <circle r="140" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.3"/>
    <circle r="115" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="8 6"/>
    
    <!-- Central Modern 'I' Monogram for Interact -->
    <path d="M-45 -85 L45 -85 L45 -55 L15 -55 L15 55 L45 55 L45 85 L-45 85 L-45 55 L-15 55 L-15 -55 L-45 -55 Z" fill="url(#goldGrad)" />
    
    <!-- Star/Spark Accent -->
    <polygon points="0,-125 10,-105 30,-95 10,-85 0,-65 -10,-85 -30,-95 -10,-105" fill="#00F0FF" transform="translate(100, -60) scale(0.6)"/>
    <polygon points="0,-125 10,-105 30,-95 10,-85 0,-65 -10,-85 -30,-95 -10,-105" fill="#F7A81B" transform="translate(-100, 80) scale(0.5)"/>
  </g>
</svg>
